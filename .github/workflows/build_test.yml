name: Build and Test Angular App

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'

jobs:
  build-and-test:
    if: github.event_name == 'push' || github.event.action == 'opened' || github.event.action == 'reopened'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js >=24.0.0
        uses: actions/setup-node@v4
        with:
          node-version: '>=24.0.0'

      - name: Install dependencies
        run: npm ci
        working-directory: webapp

      - name: Install Angular CLI 20.2.0
        run: npm install -g @angular/cli@20.2.0

      - name: Build Angular app
        run: ng build
        working-directory: webapp

      - name: Run unit tests
        run: ng test --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: webapp

      - name: Run e2e tests
        run: ng e2e
        working-directory: webapp