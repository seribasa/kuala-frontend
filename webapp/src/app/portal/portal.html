<div class="bg-gray-50 text-gray-800">
  <div class="flex h-screen">
    <aside class="w-64 bg-white flex flex-col justify-between p-4 border-r border-gray-200">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 mb-8">Kuala</h1>
        <nav>
          <ul>
            <li class="mb-2">
              <a [routerLink]="['dashboard']" routerLinkActive="bg-gray-900 text-white"
                 class="flex items-center px-4 py-2 rounded"
                 [class.text-gray-600]="!isActive('dashboard')"
                 [class.hover:bg-gray-100]="!isActive('dashboard')">
                <mat-icon aria-hidden="true">home</mat-icon>
                <span class="ml-3">Home</span>
              </a>
            </li>
            <li class="mb-2">
              <a [routerLink]="['subscriptions']" routerLinkActive="bg-gray-900 text-white"
                 class="flex items-center px-4 py-2 rounded"
                 [class.text-gray-600]="!isActive('subscriptions')"
                 [class.hover:bg-gray-100]="!isActive('subscriptions')">
                <mat-icon aria-hidden="true">workspace_premium</mat-icon>
                <span class="ml-3">Subscriptions</span>
              </a>
            </li>
            <li class="mb-2">
              <a [routerLink]="['invoice']" routerLinkActive="bg-gray-900 text-white"
                 class="flex items-center px-4 py-2 rounded"
                 [class.text-gray-600]="!isActive('invoice')"
                 [class.hover:bg-gray-100]="!isActive('invoice')">
                <mat-icon aria-hidden="true">receipt_long</mat-icon>
                <span class="ml-3">Invoice</span>
              </a>
            </li>
            <li class="mb-2">
              <a [routerLink]="['profile']" routerLinkActive="bg-gray-900 text-white"
                 class="flex items-center px-4 py-2 rounded"
                 [class.text-gray-600]="!isActive('profile')"
                 [class.hover:bg-gray-100]="!isActive('profile')">
                <mat-icon aria-hidden="true">person</mat-icon>
                <span class="ml-3">Profile</span>
              </a>
            </li>
            <li class="mb-2">
              <a (click)="logout()"
                 class="flex items-center px-4 py-2 rounded cursor-pointer hover:bg-gray-100 text-gray-600">
                <span class="material-icons">logout</span>
                <span class="ml-3">Logout</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
      <div class="mb-4">
        <nav>
          <ul>
            <li class="mb-2">
              <a [routerLink]="['about']" class="text-sm text-gray-600 hover:text-gray-900">About Us</a>
            </li>
            <li class="mb-2">
              <a [routerLink]="['help']" class="text-sm text-gray-600 hover:text-gray-900">Help</a>
            </li>
            <li>
              <a [routerLink]="['contact']" class="text-sm text-gray-600 hover:text-gray-900">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </aside>
    <main class="flex-1 p-8 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
