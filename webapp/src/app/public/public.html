<div class="min-h-screen bg-white flex flex-col">
  <mat-toolbar color="primary" class="!bg-white !text-gray-900 border-b shadow-sm">
    <div class="w-full max-w-7xl mx-auto flex items-center justify-between">
      <a [routerLink]="['/']" mat-button class="!p-0">
        <span class="flex items-center space-x-2">
          <mat-icon fontIcon="star"></mat-icon>
          <span class="font-semibold text-lg">Kuala</span>
        </span>
      </a>

      <nav class="hidden md:flex items-center space-x-2">
        <a [routerLink]="['about']" routerLinkActive="bg-red-400 text-white" mat-button
           [class.text-gray-600]="!isActive('about')"
           [class.hover:bg-gray-100]="!isActive('about')">
          About Us
        </a>
        <a [routerLink]="['help']" routerLinkActive="bg-red-400 text-white" mat-button
           [class.text-gray-600]="!isActive('about')"
           [class.hover:bg-gray-100]="!isActive('about')">
          Help
        </a>
        <a [routerLink]="['contact']" routerLinkActive="bg-red-400 text-white" mat-button
           [class.text-gray-600]="!isActive('about')"
           [class.hover:bg-gray-100]="!isActive('about')">
          Contact
        </a>
        <a matButton="tonal" (click)="login()">Login</a>
      </nav>

      <button mat-icon-button class="md:!hidden" aria-label="Open menu">
        <mat-icon fontIcon="menu"></mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <main class="flex-grow flex items-center justify-center">
    <router-outlet></router-outlet>
  </main>

  <footer class="text-xs text-gray-500 py-4 text-center">
    © 2025 Seri Basa Digital
  </footer>
</div>
