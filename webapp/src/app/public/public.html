<div class="min-h-screen bg-white flex flex-col">
  <mat-toolbar class="!bg-white !text-gray-900 !shadow-none !border-b !border-gray-200 sticky top-0 z-10">
    <div class="w-full max-w-7xl mx-auto flex items-center justify-between px-4">
      <a [routerLink]="['/']" class="no-underline text-inherit">
        <span class="font-bold text-lg tracking-wide">KUALA</span>
      </a>

      <nav class="hidden md:flex items-center space-x-1">
        <a [routerLink]="['about']" mat-button class="!text-gray-700 !text-sm">About</a>
        <a [routerLink]="['help']" mat-button class="!text-gray-700 !text-sm">Help</a>
        <a [routerLink]="['contact']" mat-button class="!text-gray-700 !text-sm">Contact</a>
        <button mat-stroked-button (click)="login()" class="!ml-3 !border-gray-900 !text-gray-900 !text-sm !font-medium !px-5">
          LOGIN
        </button>
      </nav>

      <button mat-icon-button class="md:!hidden" [attr.aria-expanded]="menuOpen" aria-controls="mobile-navigation" aria-label="Open menu" (click)="toggleMenu()">
        <mat-icon fontIcon="menu"></mat-icon>
      </button>
    </div>
  </mat-toolbar>
  @if (menuOpen) {
    <nav id="mobile-navigation" class="border-b border-gray-200 bg-white p-4 md:hidden" aria-label="Mobile navigation">
      <div class="mx-auto flex max-w-7xl flex-col gap-1">
        <a mat-button [routerLink]="['about']" (click)="toggleMenu()">About</a>
        <a mat-button [routerLink]="['help']" (click)="toggleMenu()">Help</a>
        <a mat-button [routerLink]="['contact']" (click)="toggleMenu()">Contact</a>
        <button mat-stroked-button type="button" (click)="login()">Login</button>
      </div>
    </nav>
  }

  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-gray-100 border-t border-gray-200 py-5 px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <span class="text-xs tracking-widest uppercase text-gray-500 font-medium">Seri Basa Digital</span>
      <div class="flex items-center gap-6">
        <a href="#" class="text-xs tracking-widest uppercase text-gray-500 hover:text-gray-800 no-underline font-medium">Privacy Policy</a>
        <a href="#" class="text-xs tracking-widest uppercase text-gray-500 hover:text-gray-800 no-underline font-medium">Terms of Service</a>
      </div>
    </div>
  </footer>
</div>
